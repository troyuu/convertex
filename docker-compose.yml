services:
  postgres:
    image: postgres:16-alpine
    container_name: convertex-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-convertex}
      POSTGRES_USER: ${POSTGRES_USER:-convertex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
